<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flavour Fusion - AI Recipe Blogging</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Flavour Fusion: AI-Driven Recipe Blogging</h1>
        <input type="text" id="topic" placeholder="Enter Recipe Topic (e.g., Vegan Chocolate Cake)">
        <input type="number" id="wordCount" placeholder="Enter Word Count (e.g., 1200)">
        <button id="generateBtn">Generate Recipe</button>
        <p id="joke"></p>
        <div id="output"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
